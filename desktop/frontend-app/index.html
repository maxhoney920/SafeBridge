<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SafeBridge</title>
<link rel="stylesheet" href="ui.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); }
  #ui { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }
  #gate { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; font-family: Manrope, system-ui, sans-serif; color: var(--ink); }
  #gate[hidden] { display: none; }
  #gate img { width: 72px; height: 72px; border-radius: 50%; }
  #gate h1 { margin: 6px 0 0; font-size: 21px; font-weight: 800; }
  #gate .text { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; max-width: 320px; }
  #gate .err { margin: 0; color: var(--bad); font-size: 13px; min-height: 1em; max-width: 320px; }
  #gate .btn { margin-top: 6px; padding: 10px 20px; font-size: 14px; }
  #boot { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; color: var(--muted); font: 14px Manrope, system-ui, sans-serif; }
</style>
</head>
<body>
<div id="boot">Запускаю SafeBridge…</div>
<div id="gate" hidden>
  <img src="icons/app-128.png" alt="">
  <h1></h1>
  <p class="text"></p>
  <button class="btn primary" type="button"></button>
  <p class="err" role="alert"></p>
</div>
<iframe id="ui" title="SafeBridge" hidden></iframe>
<script src="src/polyfills.js"></script>
<script type="module" src="src/boot.js"></script>
</body>
</html>
