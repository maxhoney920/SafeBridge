name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: cd host && go test ./...
      - name: Build
        env:
          # Добавьте ID расширения из Chrome Web Store через запятую, когда опубликуете
          EXTENSION_IDS: ${{ vars.EXTENSION_IDS || 'mpmmjdhamocialllnfmcpkjealmekhpl' }}
          REPO: ${{ github.repository }}
        run: ./build.sh

      # Ветка downloads — откуда расширение и помощник скачивают файлы.
      # Хранится одним коммитом, чтобы репозиторий не разрастался от старых бинарников.
      - name: Publish to downloads branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          cat > README.md <<EOF
          # Файлы VlessBridge

          Собрано из \`main\` (${GITHUB_SHA::7}). Кнопка в расширении скачивает отсюда нужный файл сама.

          | Система | Файл |
          |---|---|
          | Windows | \`vlessbridge-windows-amd64.exe\` (ARM: \`-arm64.exe\`) |
          | macOS | \`vlessbridge-macos-arm64.zip\` (Intel: \`-amd64.zip\`) |
          | Linux | \`vlessbridge-linux-amd64\` (ARM: \`-arm64\`) |
          | Расширение | \`vlessbridge-extension-*.zip\` |

          macOS и Linux одной командой: \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/raw/downloads/install.sh | sh\`
          EOF
          git init -q -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" downloads

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
