name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test
        run: cd host && go test ./...
      - name: Build
        env:
          # Добавьте ID расширения из Chrome Web Store через запятую, когда опубликуете
          EXTENSION_IDS: ${{ vars.EXTENSION_IDS || 'mpmmjdhamocialllnfmcpkjealmekhpl' }}
        run: |
          sed -i "s#OWNER/REPO#${GITHUB_REPOSITORY}#" install.sh extension/src/common.js
          ./build.sh
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
