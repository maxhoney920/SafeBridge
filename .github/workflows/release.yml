name: build
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# права только на запись в репозиторий (ветка downloads и релизы), больше ничего
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.22"
      - name: Test
        run: cd host && go test ./...
      - name: Build
        env:
          # Добавьте ID расширения из Chrome Web Store через запятую, когда опубликуете
          EXTENSION_IDS: ${{ vars.EXTENSION_IDS || 'mpmmjdhamocialllnfmcpkjealmekhpl' }}
          REPO: ${{ github.repository }}
        run: ./build.sh

      # Подпись дополнения для Firefox на addons.mozilla.org (скрытое, «unlisted»).
      # Нужны секреты AMO_JWT_ISSUER и AMO_JWT_SECRET. Версию можно подписать только один раз,
      # поэтому уже подписанный файл этой версии берётся из ветки downloads.
      - name: Sign Firefox add-on
        if: github.ref == 'refs/heads/main' && env.HAS_AMO == 'true'
        # если подпись не удалась, остальное всё равно публикуется (с неподписанным .xpi)
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          # убираем случайные пробелы и переводы строк, попавшие в секреты при вставке
          AMO_JWT_ISSUER=$(printf '%s' "$AMO_JWT_ISSUER" | tr -d '[:space:]')
          AMO_JWT_SECRET=$(printf '%s' "$AMO_JWT_SECRET" | tr -d '[:space:]')
          case "$AMO_JWT_ISSUER" in
            user:*) ;;
            *) echo "::error title=AMO_JWT_ISSUER::Издатель JWT должен начинаться с user: — похоже, в секрет вставлено другое значение (например, секрет JWT)"; exit 1 ;;
          esac
          V=$(jq -r .version extension/manifest.json)
          SIGNED="dist/vlessbridge-firefox-$V-signed.xpi"
          if ! curl -fsSL -o "$SIGNED" "https://github.com/${GITHUB_REPOSITORY}/raw/downloads/vlessbridge-firefox-$V-signed.xpi"; then
            rm -f "$SIGNED"
            mkdir -p ffsrc signed
            (cd ffsrc && unzip -q "../dist/vlessbridge-firefox-$V.xpi")
            set +e
            npx --yes web-ext@8 sign --source-dir ffsrc --artifacts-dir signed --channel unlisted \
              --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" > sign.log 2>&1
            rc=$?
            set -e
            tail -n 40 sign.log
            if [ $rc -ne 0 ] || ! ls signed/*.xpi >/dev/null 2>&1; then
              # причину показываем в аннотациях запуска, чтобы её было видно без скачивания журнала
              grep -vE '^\s*$' sign.log | tail -n 15 | sed 's/^/::error title=web-ext sign::/'
              exit 1
            fi
            cp signed/*.xpi "$SIGNED"
          fi
          cp "$SIGNED" dist/vlessbridge-firefox.xpi
          cp "$SIGNED" dist/safebridge-firefox.xpi
          # updates.json — по нему установленный Firefox сам находит и ставит новую подписанную версию
          H=$(sha256sum "$SIGNED" | cut -d' ' -f1)
          jq -n --arg v "$V" --arg h "sha256:$H" \
            --arg link "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/downloads/vlessbridge-firefox-$V-signed.xpi" \
            '{addons: {"vlessbridge@safebridge": {updates: [{version: $v, update_link: $link, update_hash: $h,
              applications: {gecko: {strict_min_version: "115.0"}}}]}}}' > dist/updates.json
          cat dist/updates.json

      # Ветка downloads — откуда расширение и помощник скачивают файлы.
      # Хранится одним коммитом, чтобы репозиторий не разрастался от старых бинарников.
      - name: Publish to downloads branch
        if: github.ref == 'refs/heads/main'
        run: |
          cd dist
          cp ../README.md README.md
          cp -r ../docs docs  # скриншоты для README
          git init -q -b downloads
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Сборка ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" downloads

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: dist/*
