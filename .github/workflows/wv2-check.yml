name: wv2-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq osslsigncode cabextract >/dev/null
          curl -fsSL -o root2010.crt http://www.microsoft.com/pki/certs/MicRooCerAut_2010-06-23.crt
          curl -fsSL -o root2011.crt http://www.microsoft.com/pki/certs/MicRooCerAut2011_2011_03_22.crt
          for c in root2010 root2011; do openssl x509 -inform DER -in $c.crt -out $c.pem; done
          cat root2010.pem root2011.pem > ms.pem
          gh api repos/westinyang/WebView2RuntimeArchive/releases/tags/109.0.1518.78 --jq '.assets[] | "\(.name) \(.size)"' || true
          for a in x64 x86; do
            f=Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.$a.cab
            curl -fsSL -o $f https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/$f || { echo "нет $f"; continue; }
            ls -l $f; sha256sum $f
            osslsigncode verify -in $f -CAfile ms.pem -TSA-CAfile /etc/ssl/certs/ca-certificates.crt 2>&1 | grep -E "Subject|Signature verification|Succeeded|Failed|Message digest|Number of" | head -20
            mkdir x && cabextract -q -d x $f && du -sh x && ls x && ls x/* | head -5 && (cd x/* && zip -qr9 ../../z.zip . ) && ls -l z.zip; rm -rf x z.zip
          done
        env:
          GH_TOKEN: ${{ github.token }}
